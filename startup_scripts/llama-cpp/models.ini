; ==============================================================================
; llama.cpp router-mode model presets
; Section name = the model id clients put in the "model" field of requests.
; Keys are CLI arg names without leading dashes (short forms also work).
; Precedence: router CLI args > model section > [*] global section.
; Preset-exclusive keys: load-on-startup, stop-timeout
;
; Paths may use ${MODELS_DIR} — start.sh substitutes it from LLAMA_MODELS_DIR,
; set in .env (gitignored) next to start.sh. No default; see .env.example.
; ==============================================================================

; (Optional) global defaults inherited by every preset unless overridden.
[*]
threads          = 14
batch-size       = 2048
ubatch-size      = 2048
cache-type-k     = q8_0
cache-type-v     = q8_0
flash-attn       = on
load-mode        = mlock
ctx-checkpoints  = 64
jinja            = true
no-warmup        = true

; --- Qwen3.6-35B-A3B-UD (MTP, thinking mode, multimodal) ---
; Request with:  "model": "Qwen3.6-35B-A3B-UD"
[Qwen3.6-35B-A3B-UD]
model            = ${MODELS_DIR}/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
mmproj           = ${MODELS_DIR}/Qwen3.6-35B-A3B-UD-mmproj.gguf
no-mmproj-offload = true
ctx-size         = 98304
predict          = 32768
fit-target       = 2048
; MTP speculative decoding (specific to this model)
spec-type        = draft-mtp
spec-draft-n-max = 2
; Thinking-mode sampling defaults
temp             = 1.0
top-p            = 0.95
top-k            = 20
min-p            = 0.0
presence-penalty = 1.5
repeat-penalty   = 1.0
reasoning-budget = 8192
; Default = thinking enabled, so no chat-template-kwargs needed.
; To force NON-thinking mode, uncomment the next line:
; chat-template-kwargs = {"enable_thinking": false}
load-on-startup  = true

; --- Example: a second model (copy & rename to add more) ---
; [gemma-3-4b]
; model  = /path/to/gemma-3-4b-it-Q8_0.gguf
